<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot Table Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .panel { border: 1px solid #ddd; padding: 16px; margin: 10px 0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .muted { color: #666; }
    </style>
</head>
<body>
    <h1>Copilot Table Test</h1>
    <div id="testContainer"></div>

    <script>
        // Test data from the actual API response
        const testData = {
            "kind": "Table",
            "id": "matches",
            "columns": [
                {"key": "candidate_id", "title": "מועמד"},
                {"key": "title", "title": "תפקיד"},
                {"key": "score", "title": "ציון"}
            ],
            "rows": [
                {"candidate_id": "68aec0191c3762b0604d3fca", "title": "עו\"ד", "score": 0.532},
                {"candidate_id": "68aebfe11c3762b0604d3fc4", "title": "מנהלת_חשבונות_1+2", "score": 0.467},
                {"candidate_id": "68aebff61c3762b0604d3fc7", "title": "מהנדס_חשמל_ובקרה", "score": 0.441}
            ],
            "primaryKey": "candidate_id"
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderCopilotTable(component, mount) {
            try {
                console.log('Rendering table:', component);
                mount = mount || document.getElementById('testContainer');
                if (!mount) {
                    console.error('No mount point found');
                    return;
                }

                const { id, columns = [], rows = [], primaryKey } = component;
                console.log('Columns:', columns);
                console.log('Rows:', rows);

                const card = document.createElement('div');
                card.className = 'panel';

                // Filter safe columns
                const safeCols = columns.filter(c => c && c.key && c.title);
                console.log('Safe columns:', safeCols);

                if (safeCols.length === 0) {
                    console.error('No safe columns found');
                    card.innerHTML = '<div class="muted">No columns to display</div>';
                    mount.appendChild(card);
                    return;
                }

                const head = safeCols.map(c => `<th>${escapeHtml(String(c.title))}</th>`).join('');
                console.log('Table head:', head);

                // Show up to 10 rows by default with an expander for the rest
                const MAX_ROWS = 10;
                const initialRows = Array.isArray(rows) ? rows.slice(0, MAX_ROWS) : [];
                const moreCount = Math.max(0, (Array.isArray(rows) ? rows.length : 0) - initialRows.length);

                const bodyHtml = (list) => {
                    if (!Array.isArray(list)) {
                        console.error('List is not an array:', list);
                        return '<tr><td colspan="' + safeCols.length + '" class="muted">No data</td></tr>';
                    }
                    return list.map(r => {
                        if (!r) return '<tr><td colspan="' + safeCols.length + '" class="muted">Invalid row</td></tr>';
                        return '<tr>' + safeCols.map(c => {
                            const value = r[c.key];
                            return `<td>${escapeHtml(String(value ?? ''))}</td>`;
                        }).join('') + '</tr>';
                    }).join('');
                };

                const title = id === 'matches' ? 'תצוגת טבלה (התאמות)' : 'תצוגת טבלה';
                card.innerHTML = `
                    <h3 style="margin-top:0">${title}</h3>
                    <div style="overflow:auto;max-height:50vh">
                        <table>
                            <thead><tr>${head}</tr></thead>
                            <tbody>${bodyHtml(initialRows) || '<tr><td class="muted" colspan="' + Math.max(safeCols.length, 1) + '">אין שורות</td></tr>'}</tbody>
                        </table>
                    </div>
                    ${moreCount > 0 ? `<button class="btn small" data-role="expand">הצג עוד (${moreCount})</button>` : ''}
                `;

                if (moreCount > 0) {
                    const btn = card.querySelector('button[data-role="expand"]');
                    if (btn) {
                        btn.addEventListener('click', () => {
                            const tb = card.querySelector('tbody');
                            try {
                                tb.innerHTML = bodyHtml(rows);
                                btn.remove();
                            } catch (e) {
                                console.error('Error expanding table:', e);
                            }
                        });
                    }
                }

                mount.appendChild(card);
                console.log('Table rendered successfully');

            } catch (error) {
                console.error('Error in renderCopilotTable:', error);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'panel';
                errorDiv.innerHTML = `<div style="color: red;">שגיאה: ${escapeHtml(error.message)}</div>`;
                mount.appendChild(errorDiv);
            }
        }

        // Test the function
        console.log('Starting table render test...');
        renderCopilotTable(testData);
        console.log('Test completed');
    </script>
</body>
</html></content>
